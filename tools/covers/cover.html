<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Geist;src:url(../../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:GeistMono;src:url(../../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2) format('woff2');font-weight:100 900}
*{margin:0;box-sizing:border-box}
html,body{width:1600px;height:1000px;overflow:hidden}
body{--g:80px;position:relative;font-family:GeistMono;letter-spacing:.08em;text-transform:uppercase;font-size:15px;
background-color:var(--bg);color:var(--fg);
background-image:linear-gradient(to right,var(--grid) 1px,transparent 1px),linear-gradient(to bottom,var(--grid) 1px,transparent 1px);
background-size:var(--g) var(--g);background-position:-1px -1px}
.t-indigo{--bg:#1A1433;--fg:#F7F5F0;--grid:rgba(247,245,240,.07);--line:rgba(247,245,240,.75);--soft:rgba(247,245,240,.22);--muted:rgba(247,245,240,.55)}
.t-ink{--bg:#0A0A0C;--fg:#F7F5F0;--grid:rgba(247,245,240,.07);--line:rgba(247,245,240,.75);--soft:rgba(247,245,240,.2);--muted:rgba(247,245,240,.55)}
.t-navy{--bg:#020F1F;--fg:#F7F5F0;--grid:rgba(91,140,255,.14);--line:rgba(247,245,240,.75);--soft:rgba(247,245,240,.2);--muted:rgba(247,245,240,.55)}
.t-cream{--bg:#F7F5F0;--fg:#0A0A0C;--grid:rgba(91,140,255,.35);--line:#0A0A0C;--soft:rgba(10,10,12,.22);--muted:rgba(10,10,12,.55)}
.lbl{position:absolute;display:flex;gap:28px}
.tl{top:56px;left:80px}.tr{top:56px;right:80px}.bl{bottom:52px;left:80px}.br{bottom:52px;right:80px}
.muted{color:var(--muted)}
.plus{position:absolute;width:21px;height:21px;margin:-10px 0 0 -10px;background:linear-gradient(var(--fg),var(--fg)) center/1.5px 100% no-repeat,linear-gradient(var(--fg),var(--fg)) center/100% 1.5px no-repeat;opacity:.6}
svg{position:absolute;inset:0}
</style></head>
<body>
<script>
const P={
 'barbershop-crm':{n:'01',t:'CRM for Barbershop',s:'React / TypeScript / Redux Toolkit / Express / Node.js / MongoDB',th:'t-indigo'},
 'finance-app':{n:'02',t:'Finance Management App',s:'React / TypeScript / Redux / Chart.js',th:'t-cream'},
 'users-filter':{n:'03',t:'Users Filter',s:'React / TypeScript / Redux Toolkit',th:'t-ink'},
 'football-helper':{n:'04',t:'Football Helper App',s:'React / TypeScript / Redux Toolkit / React Router',th:'t-navy'},
};
const slug=location.hash.slice(1),p=P[slug];
document.body.className=p.th;
const B='#5B8CFF',V='#5B4BD5';
const r=(x,y,w,h,a='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" ${a}/>`;
const L='fill="none" stroke="var(--line)" stroke-width="1.5"';
const S='fill="none" stroke="var(--soft)" stroke-width="1.5"';
let g='';
const frame=(x,y,w,h)=>r(x,y,w,h,L)+r(x,y,w,48,S)+[0,1,2].map(i=>`<circle cx="${x+28+i*22}" cy="${y+24}" r="6" ${S}/>`).join('');
if(slug==='barbershop-crm'){
 const x=240,y=160,w=1120,h=680;g+=frame(x,y,w,h);
 g+=r(x,y+48,220,h-48,S);
 for(let i=0;i<6;i++)g+=r(x+32,y+96+i*56,i==1?156:120,14,`fill="${i==1?B:'var(--soft)'}"`);
 const cx=x+260,cw=(w-300)/4,ry=y+120,rh=56;
 for(let c=0;c<4;c++){g+=`<circle cx="${cx+c*cw+24}" cy="${y+84}" r="14" ${L}/>`+r(cx+c*cw+50,y+78,cw*.45,12,'fill="var(--soft)"');}
 for(let i=0;i<9;i++)g+=`<line x1="${cx}" x2="${x+w-40}" y1="${ry+i*rh}" y2="${ry+i*rh}" stroke="var(--soft)" stroke-width="1"/>`;
 for(let c=0;c<=4;c++)g+=`<line x1="${cx+c*cw}" x2="${cx+c*cw}" y1="${ry}" y2="${ry+8*rh}" stroke="var(--soft)" stroke-width="1"/>`;
 [[0,0,2,B],[0,3,1,0],[1,1,3,V],[1,5,2,0],[2,0,1,0],[2,2,2,B],[2,6,1,0],[3,1,1,0],[3,3,3,B]].forEach(([c,s,len,col])=>{
  g+=r(cx+c*cw+8,ry+s*rh+6,cw-16,len*rh-12,col?`fill="${col}" rx="6"`:`${L} rx="6"`);
  g+=r(cx+c*cw+24,ry+s*rh+22,cw*.4,10,`fill="${col?'#F7F5F0':'var(--soft)'}"`);
 });
}
if(slug==='finance-app'){
 const x=240,y=160,w=1120,h=680;g+=frame(x,y,w,h);
 const cats=[['ALL',1],['HOME',0],['FOOD',0],['CAR',0],['EDUCATION',0]];let cx0=x+40;
 cats.forEach(([t,on])=>{const cw=t.length*11+44;g+=r(cx0,y+84,cw,44,(on?`fill="${B}" stroke="${B}"`:L)+' rx="22"')+`<text x="${cx0+cw/2}" y="${y+111}" text-anchor="middle" font-family="GeistMono" font-size="13" letter-spacing="1" fill="${on?'#0A0A0C':'var(--line)'}">${t}</text>`;cx0+=cw+12;});
 g+=r(x+w-200,y+84,160,44,`fill="var(--line)" rx="22"`)+`<text x="${x+w-120}" y="${y+111}" text-anchor="middle" font-family="GeistMono" font-size="13" letter-spacing="1" fill="var(--bg)">+ ADD</text>`;
 const cols=[B,V,'var(--line)','var(--soft)'];
 for(let i=0;i<7;i++){const ry=y+160+i*66;
  g+=`<line x1="${x+40}" x2="${x+640}" y1="${ry+66}" y2="${ry+66}" stroke="var(--soft)" stroke-width="1"/>`;
  g+=`<circle cx="${x+60}" cy="${ry+33}" r="8" fill="${cols[(i*3)%4]}"/>`+r(x+88,ry+22,140+((i*47)%80),12,'fill="var(--line)"')+r(x+88,ry+42,80,8,'fill="var(--soft)"');
  g+=r(x+560-((i*29)%40),ry+26,80+((i*29)%40),14,'fill="var(--line)"');}
 const dx=x+w-230,dy=y+380,R=120,C=2*Math.PI*R;let off=0;
 [[.42,B],[.28,V],[.18,'var(--line)'],[.12,'var(--soft)']].forEach(([f,col])=>{g+=`<circle cx="${dx}" cy="${dy}" r="${R}" fill="none" stroke="${col}" stroke-width="36" stroke-dasharray="${f*C-6} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 ${dx} ${dy})"/>`;off+=f*C;});
 g+=r(dx-60,dy-14,120,28,'fill="var(--line)"');
 [[B,'HOME'],[V,'FOOD'],['var(--line)','CAR'],['var(--soft)','EDUCATION']].forEach(([col,t],i)=>{const ly=dy+170+i*30;g+=`<circle cx="${dx-90}" cy="${ly}" r="7" fill="${col}"/><text x="${dx-72}" y="${ly+5}" font-family="GeistMono" font-size="13" letter-spacing="1" fill="var(--line)">${t}</text>`;});
}
if(slug==='users-filter'){
 const x=240,y=160,w=1120,h=680;g+=frame(x,y,w,h);
 g+=r(x+40,y+84,520,56,L+' rx="28"')+`<circle cx="${x+76}" cy="${y+112}" r="11" ${L}/><line x1="${x+84}" y1="${y+120}" x2="${x+94}" y2="${y+130}" stroke="var(--line)" stroke-width="1.5"/>`+`<text x="${x+104}" y="${y+118}" font-family="GeistMono" font-size="18" letter-spacing="1" fill="var(--line)">le|</text>`;
 [['NAME',1],['USERNAME',0],['EMAIL',0],['PHONE',0]].forEach(([t,on],i)=>{const bx=x+590+i*124;g+=r(bx,y+88,112,48,(on?`fill="${B}" stroke="${B}"`:L)+' rx="24"')+`<text x="${bx+56}" y="${y+117}" text-anchor="middle" font-family="GeistMono" font-size="13" letter-spacing="1" fill="${on?'#0A0A0C':'var(--line)'}">${t}</text>`;});
 const keep=[1,0,1,1,0,1,0];
 for(let i=0;i<7;i++){const ry=y+176+i*66,k=keep[i];
  g+=`<g opacity="${k?1:.28}"><line x1="${x+40}" x2="${x+w-40}" y1="${ry+66}" y2="${ry+66}" stroke="var(--soft)" stroke-width="1"/>`;
  g+=`<circle cx="${x+72}" cy="${ry+33}" r="18" ${k?`fill="${i%3==0?V:B}"`:L}/>`+r(x+112,ry+20,180+((i*53)%90),12,'fill="var(--line)"')+r(x+112,ry+40,120,8,'fill="var(--soft)"');
  g+=r(x+560,ry+26,90+((i*37)%60),10,'fill="var(--soft)"')+r(x+780,ry+18,92,30,(k?`stroke="${B}" fill="none" stroke-width="1.5"`:S)+' rx="15"')+r(x+w-120,ry+26,60,10,'fill="var(--soft)"')+'</g>';}
}
if(slug==='football-helper'){
 const x=280,y=170,w=1040,h=660,mx=x+w/2,my=y+h/2;
 g+=r(x,y,w,h,L);
 g+=`<line x1="${mx}" y1="${y}" x2="${mx}" y2="${y+h}" ${L}/><circle cx="${mx}" cy="${my}" r="90" ${L}/><circle cx="${mx}" cy="${my}" r="4" fill="var(--line)"/>`;
 [0,1].forEach(s=>{const sx=s?x+w:x,d=s?-1:1;
  g+=r(s?sx-170:sx,my-200,170,400,L)+r(s?sx-62:sx,my-90,62,180,L);
  g+=`<path d="M ${sx+d*170} ${my-70} A 90 90 0 0 ${s?0:1} ${sx+d*170} ${my+70}" ${L}/>`;
  g+=`<circle cx="${sx+d*115}" cy="${my}" r="4" fill="var(--line)"/>`;});
 const F=[[.06,.5],[.2,.18],[.2,.39],[.2,.61],[.2,.82],[.36,.3],[.36,.5],[.36,.7],[.45,.2],[.45,.5],[.45,.8]];
 F.forEach(([fx,fy],i)=>{const px=x+fx*w,py=y+fy*h;g+=`<circle cx="${px}" cy="${py}" r="15" fill="${B}"/>`;});
 F.forEach(([fx,fy])=>{const px=x+(1-fx)*w,py=y+(fx>.3?1-fy:fy)*h;g+=`<circle cx="${px}" cy="${py}" r="15" fill="none" stroke="var(--line)" stroke-width="2.5"/>`;});
}
document.body.innerHTML=`<svg width="1600" height="1000" viewBox="0 0 1600 1000">${g}</svg>
<div class="lbl tl"><span>// ${p.n}</span><span>${p.t}</span></div>
<div class="lbl tr muted"><span>FIG. ${p.n} — SCHEMATIC</span></div>
<div class="lbl bl muted"><span>${p.s}</span></div>
<div class="lbl br muted"><span>OS v2.0</span></div>
${[[80,120],[1520,120],[80,880],[1520,880],[800,120],[800,880]].map(([l,t])=>`<i class="plus" style="left:${l}px;top:${t}px"></i>`).join('')}`;
</script>
</body></html>
